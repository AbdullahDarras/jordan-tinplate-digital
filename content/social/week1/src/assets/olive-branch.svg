<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260">
  <!-- Illustrative olive branch: one curved stem, leaves in pairs, a few olives. Drawn for the olive-season posts. -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d98a"/><stop offset=".5" stop-color="#6f9e45"/><stop offset="1" stop-color="#3f6b2a"/>
    </linearGradient>
    <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e6b8"/><stop offset="1" stop-color="#8fae6a"/>
    </linearGradient>
    <radialGradient id="ol" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#9aa64a"/><stop offset=".45" stop-color="#4d5a1e"/><stop offset="1" stop-color="#232a0b"/>
    </radialGradient>
    <radialGradient id="olp" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8a5a7a"/><stop offset=".5" stop-color="#3d2140"/><stop offset="1" stop-color="#1a0c1c"/>
    </radialGradient>
    <g id="leaf"><path d="M0 0 C 30 -16, 80 -14, 112 0 C 80 14, 30 16, 0 0 Z" fill="url(#lf)"/><path d="M4 0 L 104 0" stroke="#e7f0cf" stroke-opacity=".55" stroke-width="2"/></g>
    <g id="leafb"><path d="M0 0 C 30 -15, 78 -13, 106 0 C 78 13, 30 15, 0 0 Z" fill="url(#lb)"/><path d="M4 0 L 98 0" stroke="#fff" stroke-opacity=".5" stroke-width="2"/></g>
  </defs>
  <path d="M10 210 C 140 170, 260 120, 420 96 C 480 88, 540 84, 592 70" fill="none" stroke="#5b4a2a" stroke-width="7" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(70 190) rotate(-70)"/>
  <use href="#leafb" transform="translate(96 182) rotate(30)"/>
  <use href="#leaf" transform="translate(150 162) rotate(-58)"/>
  <use href="#leafb" transform="translate(176 154) rotate(38)"/>
  <use href="#leaf" transform="translate(236 132) rotate(-50)"/>
  <use href="#leafb" transform="translate(262 126) rotate(32)"/>
  <use href="#leaf" transform="translate(320 110) rotate(-42)"/>
  <use href="#leafb" transform="translate(350 104) rotate(28)"/>
  <use href="#leaf" transform="translate(410 96) rotate(-36)"/>
  <use href="#leafb" transform="translate(440 92) rotate(22)"/>
  <use href="#leaf" transform="translate(500 86) rotate(-28)"/>
  <use href="#leaf" transform="translate(560 74) rotate(-8)"/>
  <path d="M206 142 L 214 168 M 296 118 L 300 146 M 382 100 L 392 128" stroke="#5b4a2a" stroke-width="3"/>
  <ellipse cx="216" cy="184" rx="17" ry="22" fill="url(#ol)"/>
  <ellipse cx="302" cy="162" rx="16" ry="21" fill="url(#olp)"/>
  <ellipse cx="394" cy="144" rx="17" ry="22" fill="url(#ol)"/>
