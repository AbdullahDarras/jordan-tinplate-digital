<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Readex+Pro:wght@400..600&display=swap">
<style>
/* Source of assets/img/og-default.png (1200 x 630). Render with:  node tools/screenshots.mjs og assets/img/og-default.png
   The logo is injected from brand/logo/logo-horizontal.svg (white), the tin is og-tin.png (a capture of the site's 3D hero tin: node tools/screenshots.mjs og-tin <baseUrl>). */
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(60% 85% at 78% 45%,#274f83 0%,#002F6C 56%,#00193b 100%);color:#fff;font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;position:relative}
body::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,19,45,.35),transparent 55%)}
.logo{position:absolute;left:72px;top:64px;width:420px;height:auto;fill:#fff;z-index:2}
h1{position:absolute;left:72px;top:232px;width:600px;margin:0;font-size:60px;line-height:1.06;letter-spacing:-.03em;z-index:2}
p{position:absolute;left:72px;top:452px;margin:0;font-size:32px;color:#f4b34c;direction:rtl;font-family:"Readex Pro","DejaVu Sans",sans-serif;z-index:2}
.s{position:absolute;left:72px;top:540px;font-size:24px;letter-spacing:.04em;color:#d8e0ec;z-index:2}
.t{position:absolute;right:10px;top:30px;height:620px;width:auto;z-index:1;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35))}
</style></head><body>
<!--LOGO-->
<h1>Custom tinplate packaging for food &amp; beverage brands</h1>
<p>علب معدنية مخصّصة للأغذية والمشروبات</p>
<div class="s">Made in Jordan since 1998</div>
<img class="t" src="og-tin.png" alt="">
</body></html>
